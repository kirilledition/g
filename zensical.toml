[project]
site_name = "g"
site_description = "GPU-oriented REGENIE Step 2 GWAS engine"
site_author = "kirill denisov"
site_url = "https://kirilledition.github.io/g/"
repo_url = "https://github.com/kirilledition/g"
repo_name = "kirilledition/g"
edit_uri = "edit/main/documentation/"
docs_dir = "documentation"
site_dir = "documentation_rendered_website"
nav = [
  { "Home" = "index.md" },
  { "User Guide" = [
    "public/index.md",
    "public/getting-started.md",
    "public/installation.md",
    "public/quickstart.md",
    "public/algorithm.md",
    "public/cli.md",
    "public/configuration.md",
    "public/input-output.md",
    "public/gpu-and-slurm.md",
    "public/troubleshooting.md",
  ] },
  { "Development" = [
    "development/index.md",
    "development/documentation.md",
    "development/architecture.md",
    "development/ROADMAP.md",
    "development/STYLEGUIDE.md",
    "development/NO_NIX_DEVELOPMENT.md",
    "development/UBUNTU_SLURM_DEVELOPMENT.md",
    "development/tooling.md",
    "development/justfile.md",
    "development/dev-tooling-architecture.md",
    "development/configuration_cli_architecture.md",
    "development/logging-setup.md",
    "development/performance-discovery.md",
    "development/simd-optimization-reference.md",
    "development/symphony.md",
  ] },
  { "Scratchpad" = [
    "scratchpad/index.md",
    "scratchpad/agent-learning.md",
    "scratchpad/linear-regenie-step2-learning.md",
    "scratchpad/binary-regenie-step2-learning.md",
    "scratchpad/output-performance-results.md",
  ] },
]
extra_css = ["assets/stylesheets/g-docs.css"]
extra_javascript = [
  "assets/javascripts/section-scroll.js",
  "assets/javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
  "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js",
  "assets/javascripts/mermaid.js",
]

[project.extra]
generator = false

[project.theme]
variant = "modern"
logo = "assets/images/sparkles-logo.svg"
favicon = "assets/images/sparkles-favicon.svg"
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.top",
  "search.highlight",
  "content.action.edit",
  "content.action.view",
]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
