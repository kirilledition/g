[project]
name = "g"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "kirill denisov", email = "101817863+kirilledition@users.noreply.github.com" },
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "jax[cuda12]>=0.11.0,<0.12",
    "nvidia-libnvcomp-cu12>=5.3.0.16,<6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "gputil>=1.4.0",
    "hydra-core>=1.3.2",
    "maturin>=1.14.1,<2.0",
    "memray>=1.19.3",
    "omegaconf>=2.3.0",
    "pooch>=1.8.2",
    "polars>=1.41.2",
    "psutil>=7.2.2",
    "py-cpuinfo>=9.0.0",
    "pyarrow>=24.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.16",
    "scalene>=2.3.0",
    "ty>=0.0.44",
    "radon>=6.0.1",
    "pyan3>=2.6.1",
    "vulture>=2.16",
    "skylos>=4.28.0",
]
docs = [
    "mkdocstrings-python>=2.0.4",
    "zensical>=0.0.44,<0.0.45",
]
cpu = ["jax[cpu]>=0.11.0,<0.12"]

[project.scripts]
g = "g.cli:main"

[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["extension-module"]
module-name = "g._core"
python-packages = ["g"]
python-source = "src"

[tool.uv]
cache-keys = [
    { file = ".cargo/config.toml" },
    { file = "pyproject.toml" },
    { file = "src/**/*.rs" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/build.rs" },
    { file = "crates/**/*.cc" },
    { file = "crates/**/*.cu" },
    { file = "crates/**/*.h" },
    { file = "crates/**/*.ptx" },
    { file = "vendor/openxla/**/*.h" },
    { file = "vendor/openxla/*.md" },
    { file = "vendor/openxla/LICENSE" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.toml" },
    { file = "crates/interface/src/config.default.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["reference/", "scripts/", ".git/", ".agents/"]

[tool.ruff.lint]
fixable = ["ALL"]
select = [
    "F",   # Pyflakes rules
    "W",   # PyCodeStyle warnings
    "E",   # PyCodeStyle errors
    "I",   # Sort imports properly
    "UP",  # Warn if certain things can changed due to newer Python versions
    "C4",  # Catch incorrect use of comprehensions, dict, list, etc
    "FA",  # Enforce from __future__ import annotations
    "ISC", # Good use of string concatenation
    "ICN", # Use common import conventions
    "RET", # Good return practices
    "SIM", # Common simplification rules
    "TID", # Some good import practices
    "TC",  # Enforce importing certain types in a TYPE_CHECKING block
    "PTH", # Use pathlib instead of os.path
    "TD",  # Be diligent with TODO comments
    "NPY", # Some numpy-specific things
    "PD",  # Pandas-specific rules
    "N",   # Naming conventions
    "RUF", # Ruff-specific rules
    "A",   # detect shadowed builtins
    "BLE", # disallow catch-all exceptions
    "COM", # enforce trailing comma rules
    "DTZ", # require strict timezone manipulation with datetime
    "FBT", # detect boolean traps
    "D",   # docstrings
]
ignore = [
    "COM812", # enforce trailing comma rules
    "D200",   # one-line docstring should fit on one line
    "D203",   # allow blank line before class docstrings
    "D213",   # allow free-form second summary line
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D", # docstrings
]
"scripts/*" = [
    "D",    # docstrings
    "T201", # allow print() in scripts
]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["typing"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"jax.numpy" = "jnp"
"numpy.typing" = "npt"
"polars" = "pl"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "phase0_data: requires local Phase 0 data or generated baseline artifacts.",
    "phase1_parity: exercises Phase 1 parity and benchmark evaluation flows against external baselines.",
    "cli_smoke: runs the installed CLI against a committed tiny end-to-end fixture.",
]

# Local-first static analysis (skylos). Default excludes already cover
# .venv/node_modules/__pycache__; this list drops dependency caches and
# non-product trees so full-repo scans stay focused on src/ + crates/.
[tool.skylos]
exclude = [
    ".tools",
    "target",
    "tests",
    "tooling",
    "scripts",
    "data",
    "reference",
    "documentation",
    "documentation_rendered_website",
    "outputs",
    "results",
    ".ruff_cache",
    ".skylos",
]

[tool.coverage.run]
branch = true
source = ["src/g"]

[tool.coverage.report]
fail_under = 90
omit = [
    # Internal package markers only; src/g/__init__.py has lazy public API logic.
    "src/g/**/*/__init__.py",
]
exclude_also = [
    # Annotation-only import blocks are not reachable at runtime.
    "if typing\\.TYPE_CHECKING\\s*:",
]
show_missing = true
skip_covered = false
