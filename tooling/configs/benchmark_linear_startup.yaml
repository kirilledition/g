defaults:
  - dataset: local_1kg
  - machine: landau_gpu
  - workload: regenie2_chr22_matrix
  - _self_

tool:
  name: linear_startup
  device: ${machine.device}
  chunk_size: ${workload.chunk_size}
  cpu_threads: ${machine.cpus_per_task}
  output_writer_thread_count: 8
  include_fresh_process: true
  hot_run_count: 5
  diagnostic_run_count: 0
  multi_phenotype_count: 1
  multi_phenotype_sample_mode: complete-case
  expected_variant_count: 418943
  data_dir: ${dataset.data_directory}
  output_dir: null
  jax_cache_dir: null
  python_executable: null
  json_summary_path: null

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: /tmp/g-hydra-runs
