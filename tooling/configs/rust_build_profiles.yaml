defaults:
  - _self_

tool:
  labels:
    - dev
    - release
  output_parent: results/perf/rust-build-profiles
  clean_build: true
  incremental_touch_paths:
    - src/binding/mod.rs
    - crates/genotype/src/bgen/reader.rs
    - crates/output/src/session.rs
  build_timeout_seconds: null
  runtime_timeout_seconds: 120
  run_import_timing: true
  run_smoke_command: true
  smoke_command:
    - uv
    - run
    - --no-sync
    - python
    - -c
    - "import g; import g._core; print('ok')"
  run_gpu_smoke: false
  gpu_smoke_command: []

hydra:
  job:
    chdir: false
