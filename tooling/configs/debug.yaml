defaults:
  - dataset: local_1kg
  - workload: regenie2_chr22_matrix
  - _self_

tool:
  name: check_pyo3_stub
  input_npz: null
  p_threshold: 0.05
  firth_se: false
  relative_tolerance: 1.0e-5
  absolute_tolerance: 1.0e-5
  bgen: ${dataset.data_directory}/${dataset.bgen_file}
  sample: ${dataset.data_directory}/${dataset.sample_file}
  pheno_file: ${dataset.data_directory}/${dataset.phenotype_file}
  pheno_col: phenotype_binary
  covar_file: ${dataset.data_directory}/covariates.txt
  covar_col_list: age,sex
  pred: ${dataset.data_directory}/${dataset.prediction_list}
  variant_ids: []
  variant_indices: []
  chunk_size: ${workload.chunk_size}
  variant_limit: ${workload.variant_limit}
  output_json: data/debug/tooling_debug.json
  regenie_debug_jsonl: null
  trusted_no_missing_diploid: false
  path: null
  require_optional_files: false
  native_binary_path: target/dev-fast/g
  python_executable_path: null
  trial_count: 5
  warmup_count: 1
  expected_jax_device: cpu
  jax_platforms: cpu

hydra:
  job:
    chdir: false
