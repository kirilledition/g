defaults:
  - dataset: local_1kg
  - machine: landau_gpu
  - workload: regenie2_chr22_matrix
  - telemetry: local
  - _self_

tool:
  chromosome_label: chr22
  run_directory_prefix: tensorqtl_chr22
  data_dir: ${dataset.data_directory}
  bgen: ${dataset.bgen_file}
  sample: ${dataset.sample_file}
  plink_prefix: 1kg_chr22_full
  phenotype_file: pheno_cont.txt
  phenotype_column: phenotype_continuous
  covariate_file: covariates.txt
  covariate_columns: age,sex
  prediction_list: baselines/regenie_step1_qt_pred.list
  output_parent: data/benchmarks
  output_dir: null
  dry_run: false
  validate_inputs: true
  variant_limit: null
  chunk_size: ${workload.chunk_size}
  cpu_threads: ${machine.cpus_per_task}
  tensorqtl_batch_size: 20000
  tensorqtl_repository_url: https://github.com/broadinstitute/tensorqtl.git
  tensorqtl_commit: 0c4db65a0cdc47f3b824ae530b89d270ef5e0096
  tensorqtl_tools_dir: .tools/tensorqtl
  tensorqtl_python: "3.12"
  torch_package: torch==2.5.1+cu121
  torch_package_index_url: https://download.pytorch.org/whl/cu121
  plink2_binary: null
  command_timeout_seconds: null
  g_runner_prefix:
    - uv
    - run
    - --no-sync
    - g
    - regenie

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: /tmp/g-hydra-runs
