defaults:
  - dataset: local_1kg
  - machine: landau_gpu
  - workload: regenie2_chr22_matrix
  - telemetry: local
  - _self_

tool:
  chromosome_label: chr22
  run_directory_prefix: torchgwas_chr22
  data_dir: ${dataset.data_directory}
  bgen: ${dataset.bgen_file}
  sample: ${dataset.sample_file}
  torchgwas_full_genotype: 1kg_chr22_full.bed
  torchgwas_full_genotype_format: plink
  torchgwas_full_bim: 1kg_chr22_full.bim
  torchgwas_full_fam: 1kg_chr22_full.fam
  phenotype_file: pheno_cont.txt
  phenotype_column: phenotype_continuous
  covariate_file: covariates.txt
  covariate_columns: age,sex
  prediction_list: baselines/regenie_step1_qt_pred.list
  output_parent: data/benchmarks
  output_dir: null
  dry_run: false
  validate_inputs: true
  chunk_size: ${workload.chunk_size}
  cpu_threads: ${machine.cpus_per_task}
  torchgwas_repository_url: https://github.com/ZhiGroup/TorchGWAS.git
  torchgwas_commit: 9e0070c8ca1e8fc862b98e6d3077652577cfceb5
  torchgwas_tools_dir: .tools/torchgwas
  torchgwas_python: /usr/bin/python3.12
  torch_package: torch==2.5.1+cu121
  torch_package_index_url: https://download.pytorch.org/whl/cu121
  plink2_binary: null
  command_timeout_seconds: null
  g_runner_prefix:
    - uv
    - run
    - --no-sync
    - g
    - regenie

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: /tmp/g-hydra-runs
