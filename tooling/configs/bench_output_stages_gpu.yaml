defaults:
  - dataset: local_1kg
  - machine: landau_gpu
  - workload: bgen_reader
  - telemetry: local
  - sweep: bgen_reader_default
  - _self_

tool:
  data_dir: ${dataset.data_directory}
  output_dir: data/benchmarks/output_stages
  device: ${machine.device}
  small_bsize: 1024
  large_bsize: 8192
  extra_bsizes:
    - 16384
  many_phenotype_count: 8
  variant_limit: null
  trials: 1
  writer_thread_counts:
    - 1
    - 2
    - 4
    - 8
    - 12
  writer_queue_depth_multipliers:
    - 1
    - 2
    - 4
  chunks_per_arrow_file_values:
    - 4
    - 16
    - 64
  arrow_compressions:
    - zstd
    - none
  json_summary_path: ${telemetry.json_summary_path}
  markdown_summary_path: ${telemetry.markdown_summary_path}
  enable_jax_trace: false
  jax_trace_case_limit: 1

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: /tmp/g-hydra-runs
