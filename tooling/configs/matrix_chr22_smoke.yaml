defaults:
  - dataset: local_1kg
  - machine: landau_gpu
  - workload: regenie2_chr22_matrix
  - telemetry: local
  - _self_

tool:
  chromosome_label: chr22
  run_directory_prefix: regenie2_chr22_matrix_smoke
  data_dir: ${dataset.data_directory}
  bgen: ${dataset.bgen_file}
  sample: ${dataset.sample_file}
  covariate_file: covariates.txt
  covariate_columns: age,sex
  linear_phenotype_file: pheno_cont.txt
  linear_phenotype_column: phenotype_continuous
  linear_prediction_list: baselines/regenie_step1_qt_pred.list
  binary_phenotype_file: ${dataset.phenotype_file}
  binary_phenotype_column: phenotype_binary
  binary_prediction_list: ${dataset.prediction_list}
  output_parent: data/benchmarks
  output_dir: null
  previous_manifest_path: null
  dry_run: false
  validate_inputs: true
  chunk_size: ${workload.chunk_size}
  variant_limit: 1000
  cpu_threads: ${machine.cpus_per_task}
  staging_depth: ${workload.staging_depth}
  output_writer_thread_count: ${workload.output_writer_thread_count}
  output_writer_queue_depth: ${workload.output_writer_queue_depth}
  trusted_no_missing_diploid: true
  trusted_bgen_validation_mode: cache_on_miss
  gpu_genotype_format: dosage
  cpu_jax_persistent_cache: false
  gpu_jax_persistent_cache: true
  jax_cache_dir: null
  jax_persistent_cache_min_entry_size_bytes: -1
  jax_persistent_cache_min_compile_time_seconds: 0
  jax_xla_autotune_cache: false
  binary_firth: true
  binary_approx: true
  binary_p_threshold: 0.05
  binary_firth_batch_size: null
  binary_firth_candidate_capacity: null
  output_format: parquet
  finalize_parquet: false
  telemetry_mode: progress
  log_filter: info
  log_stderr: true
  progress_interval_seconds: 5.0
  progress_interval_chunks: 10
  runner_prefix:
    - uv
    - run
    - --no-sync
    - g
    - regenie

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: /tmp/g-hydra-runs
