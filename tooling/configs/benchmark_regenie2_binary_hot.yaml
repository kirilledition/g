defaults:
  - dataset: local_1kg
  - machine: landau_gpu
  - workload: regenie2_binary_hot
  - _self_

tool:
  data_dir: ${dataset.data_directory}
  bgen: ${dataset.bgen_file}
  sample: ${dataset.sample_file}
  phenotype_file: ${dataset.phenotype_file}
  covariate_file: covariates.txt
  prediction_list: ${dataset.prediction_list}
  phenotype_column: phenotype_binary
  covariate_columns:
    - age
    - sex
  output_dir: null
  device: ${machine.device}
  chunk_size: 16384
  firth_batch_size: 512
  firth_candidate_capacity: 1024
  writer_thread_count: 8
  p_threshold: 0.05
  expected_variant_count: 418943
  jax_cache_dir: data/profiles/jax-binary-hot-cache
  include_fresh_process: true
  hot_run_count: 5
  diagnostic_run_count: 0
  python_executable: null
  summary_path: null

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: /tmp/g-hydra-runs
