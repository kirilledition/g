defaults:
  - dataset: local_1kg
  - machine: local
  - workload: bgen_reader
  - telemetry: local
  - sweep: bgen_reader_default
  - _self_

tool:
  bgen: ${dataset.data_directory}/${dataset.bgen_file}
  sample: ${dataset.data_directory}/${dataset.sample_file}
  chunk_size: ${workload.chunk_size}
  chunk_sizes: ${sweep.chunk_sizes}
  variant_limit: ${workload.variant_limit}
  repeat_count: ${workload.repeat_count}
  path_modes: ${sweep.path_modes}
  sample_selection_mode: full
  sample_selection_modes: ${sweep.sample_selection_modes}
  decode_tile_variant_count: null
  decode_tile_variant_counts: ${sweep.decode_tile_variant_counts}
  rayon_thread_count: null
  rayon_thread_counts: ${sweep.rayon_thread_counts}
  trusted_no_missing_diploid: false
  trusted_no_missing_diploid_modes: ${sweep.trusted_no_missing_diploid_modes}
  emit_case_json: false
  json_summary_path: ${telemetry.json_summary_path}
  markdown_summary_path: ${telemetry.markdown_summary_path}

hydra:
  job:
    chdir: false
