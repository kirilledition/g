defaults:
  - dataset: local_1kg
  - machine: local
  - workload: regenie2_chr22_matrix
  - _self_

tool:
  name: baselines
  data_directory: ${dataset.data_directory}
  include_hail: false
  include_gpu: false
  cpu_only: true
  variant_limit: ${workload.variant_limit}
  chunk_size: ${workload.chunk_size}
  only_quantitative_step2: false
  only_binary_step2: false
  output_dir: null
  include_patched_regenie: false
  patched_regenie_executable: null
  sample_interval_seconds: 0.1
  g_variant_limit: ${workload.variant_limit}
  g_chunk_size: ${workload.chunk_size}
  enable_jax_trace: false
  enable_memory_profile: false
  device: ${machine.device}
  finalize_parquet: true
  output_writer_thread_count: 1
  trials: 3
  warmup_trials: 1
  same_process_trials: 0
  same_process_warmup_trials: 1
  multi_phenotype_count: 1
  multi_phenotype_sample_mode: complete-case
  emit_stage_timings: false
  data_dir: ${dataset.data_directory}
  json_summary_path: null

hydra:
  job:
    chdir: false
