[package]
name = "g"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib", "rlib"]

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py314" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.14.
pyo3 = { version = "0.28.3", features = ["abi3-py314"], optional = true }
numpy = { version = "0.28.0", optional = true }
arrow = { version = "58.3.0", features = ["ipc_compression"] }
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "zstd"] }
crossbeam-channel = "0.5.15"
burn = { version = "0.21.0", default-features = false, features = ["std"], optional = true }
burn-backend = { version = "0.21.0", default-features = false, optional = true }
burn-cubecl = { version = "0.21.0", default-features = false, features = ["std"], optional = true }
clap = { version = "4.5.53", features = ["derive"] }
cudarc = { version = "0.19.7", default-features = false, features = ["std", "driver", "nvrtc", "cuda-12020", "dynamic-loading", "fallback-dynamic-loading"], optional = true }
csv = "1.4.0"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
memmap2 = "0.9.10"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
statrs = "0.18.0"
thiserror = "2.0.18"
tracing = "0.1.43"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
pyo3-pylogger = { version = "0.5.2", default-features = false, features = ["tracing"], optional = true }

[features]
default = []
python = ["dep:numpy", "dep:pyo3", "dep:pyo3-pylogger"]
extension-module = ["python", "pyo3/extension-module"]
burn-wgpu = ["dep:burn", "burn/fusion", "burn/wgpu"]
burn-cuda = ["dep:burn", "burn/cuda", "burn/fusion"]
burn-cubecl-kernel = ["dep:burn-backend", "dep:burn-cubecl", "burn-wgpu"]
cuda-kernel = ["dep:cudarc"]

[dev-dependencies]
criterion = "0.8.2"

[[test]]
name = "rust_python_bindings"
path = "tests/rust_python_bindings.rs"
required-features = ["python"]

[[bench]]
name = "bgen_read"
harness = false

[[bench]]
name = "preprocess"
harness = false

[[bin]]
name = "regenie2-linear-native"
path = "src/bin/regenie2-linear-native.rs"
required-features = ["cuda-kernel"]

[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 1
debug = 1
lto = "fat"
strip = "none"

[profile.perf-dev]
inherits = "release"
opt-level = 3
codegen-units = 16
debug = 0
lto = "thin"
strip = "symbols"

[profile.bench]
opt-level = 3
codegen-units = 1
debug = 1
lto = "fat"
strip = "none"
