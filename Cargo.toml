[package]
name = "g"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"

[workspace]
members = [
    ".",
    "crates/cli",
    "crates/engine",
    "crates/genotype",
    "crates/input",
    "crates/interface",
    "crates/output",
    "crates/plan",
    "crates/runtime",
]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib", "rlib"]

[workspace.dependencies]
arrow = { version = "59.0.0", features = ["ipc_compression"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
criterion = "0.8.2"
crossbeam-channel = "0.5.15"
csv = "1.4.0"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
g-cli = { path = "crates/cli" }
g-engine = { path = "crates/engine" }
g-genotype = { path = "crates/genotype" }
g-input = { path = "crates/input" }
g-interface = { path = "crates/interface" }
g-output = { path = "crates/output" }
g-plan = { path = "crates/plan" }
g-runtime = { path = "crates/runtime" }
memchr = "2.8.1"
memmap2 = "0.9.10"
nalgebra = { version = "0.34.1", default-features = false, features = ["std"] }
numpy = "0.28.0"
parquet = { version = "59.0.0", default-features = false, features = ["arrow", "zstd"] }
pyo3 = { version = "0.28.3", features = ["abi3-py314"] }
pyo3-pylogger = { version = "0.5.2", default-features = false, features = ["tracing"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
signal-hook = { version = "0.4.4", default-features = false }
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.4", features = ["v4"] }

[workspace.lints.clippy]
pedantic = "warn"

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py314" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.14.
pyo3 = { workspace = true }
numpy = { workspace = true }
arrow = { workspace = true }
g-engine = { workspace = true }
g-cli = { workspace = true }
g-genotype = { workspace = true }
g-input = { workspace = true }
g-interface = { workspace = true }
g-output = { workspace = true }
g-plan = { workspace = true }
g-runtime = { workspace = true }
nalgebra = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
pyo3-pylogger = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[features]
default = []
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true

[profile.dev-fast]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
lto = "off"

[profile.dev-opt]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
lto = "off"

[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 8
debug = "line-tables-only"
lto = "thin"
strip = "none"
incremental = false

[profile.perf-thin-cgu1]
inherits = "release"
opt-level = 3
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
strip = "none"
incremental = false

[profile.perf-max]
inherits = "release"
opt-level = 3
codegen-units = 1
debug = "line-tables-only"
lto = "fat"
strip = "none"
incremental = false

[profile.perf-o2]
inherits = "release"
opt-level = 2
codegen-units = 8
debug = "line-tables-only"
lto = "thin"
strip = "none"
incremental = false

[profile.bench]
opt-level = 3
codegen-units = 8
debug = "line-tables-only"
lto = "thin"
strip = "none"
