[package]
name = "g"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib", "rlib"]

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py314" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.14.
pyo3 = { version = "0.28.3", features = ["abi3-py314"] }
numpy = "0.28.0"
arrow = { version = "59.0.0", features = ["ipc_compression"] }
parquet = { version = "59.0.0", default-features = false, features = ["arrow", "zstd"] }
crossbeam-channel = "0.5.15"
csv = "1.4.0"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
memchr = "2.8.1"
memmap2 = "0.9.10"
rayon = "1.12.0"
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
pyo3-pylogger = { version = "0.5.2", default-features = false, features = ["tracing"] }
clap = { version = "4.6.1", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
signal-hook = { version = "0.4.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.2"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "bgen_read"
harness = false

[[bench]]
name = "preprocess"
harness = false

[profile.dev-fast]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
lto = "off"

[profile.dev-opt]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
lto = "off"

[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 8
debug = "line-tables-only"
lto = "thin"
strip = "none"
incremental = false

[profile.perf-thin-cgu1]
inherits = "release"
opt-level = 3
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
strip = "none"
incremental = false

[profile.perf-max]
inherits = "release"
opt-level = 3
codegen-units = 1
debug = "line-tables-only"
lto = "fat"
strip = "none"
incremental = false

[profile.perf-o2]
inherits = "release"
opt-level = 2
codegen-units = 8
debug = "line-tables-only"
lto = "thin"
strip = "none"
incremental = false

[profile.bench]
opt-level = 3
codegen-units = 8
debug = "line-tables-only"
lto = "thin"
strip = "none"
