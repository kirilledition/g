[package]
name = "g"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]
members = [
    ".",
    "crates/compute-cuda",
    "crates/engine",
    "crates/genotype",
    "crates/genotype-cuda",
    "crates/genotype-contracts",
    "crates/input",
    "crates/interface",
    "crates/output",
    "crates/plan",
    "crates/runner",
    "crates/runtime",
]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib", "rlib"]

[workspace.dependencies]
ahash = "0.8.12"
arrow = "59.1.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.2", features = ["derive"] }
criterion = "0.8.2"
crossbeam-channel = "0.5.16"
cc = "1.3.0"
csv = "1.4.0"
hex = "0.4.3"
g-compute-cuda = { path = "crates/compute-cuda" }
g-engine = { path = "crates/engine" }
g-genotype = { path = "crates/genotype" }
g-genotype-cuda = { path = "crates/genotype-cuda" }
g-genotype-contracts = { path = "crates/genotype-contracts" }
g-input = { path = "crates/input" }
g-interface = { path = "crates/interface" }
g-output = { path = "crates/output" }
g-plan = { path = "crates/plan" }
g-runner = { path = "crates/runner" }
g-runtime = { path = "crates/runtime" }
libdeflate-sys = "1.25.2"
memchr = "2.8.3"
memmap2 = "0.9.11"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
numpy = "0.29.0"
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "zstd"] }
pyo3 = { version = "0.29.0", features = ["abi3-py314"] }
pyo3-pylogger = { version = "0.5.2", default-features = false, features = ["tracing"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
signal-hook = { version = "0.4.4", default-features = false }
thiserror = "2.0.19"
toml = "1.1.3"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v4"] }
zstd = { version = "0.13.3", default-features = false }

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unreachable_pub = "deny"

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py314" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.14.
pyo3 = { workspace = true }
numpy = { workspace = true }
g-compute-cuda = { workspace = true }
g-engine = { workspace = true }
g-genotype = { workspace = true }
g-genotype-cuda = { workspace = true }
g-genotype-contracts = { workspace = true }
g-input = { workspace = true }
g-output = { workspace = true }
g-plan = { workspace = true }
g-runner = { workspace = true }
pyo3-pylogger = { workspace = true }

[features]
default = []
extension-module = ["pyo3/extension-module"]
private-test-support = ["g-genotype-cuda/private-test-support"]

[lints]
workspace = true

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
lto = "off"

[profile.release]
opt-level = 3
codegen-units = 1
debug = "line-tables-only"
lto = "fat"
strip = "none"
incremental = false
