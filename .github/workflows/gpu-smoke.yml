name: GPU Smoke

on:
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: JSON array of self-hosted runner labels.
        required: true
        default: '["self-hosted","linux","x64","gauss","gpu-slurm"]'
  schedule:
    - cron: "49 4 1 * *"

concurrency:
  group: gpu-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SLURM_GPU_NODE: landau
  SLURM_GPUS_PER_TASK: "1"
  SLURM_CPUS_PER_TASK: "8"
  SLURM_MEMORY: 64G
  SLURM_TIME: "00:45:00"

jobs:
  gpu-smoke:
    name: gpu-smoke
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner_labels_json || vars.G_GPU_RUNNER_LABELS_JSON || '["self-hosted","linux","x64","gauss","gpu-slurm"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run GPU smoke through SLURM
        shell: bash
        env:
          G_GPU_SMOKE_ARTIFACT_DIR: artifacts/gpu-smoke
          RUSTFLAGS: "--allow=non-local-definitions"
        run: |
          set -euo pipefail
          mkdir -p artifacts/gpu-smoke/slurm

          slurm_arguments=(
            "--nodelist=${SLURM_GPU_NODE}"
            "--gres=gpu:${SLURM_GPUS_PER_TASK}"
            "--cpus-per-task=${SLURM_CPUS_PER_TASK}"
            "--mem=${SLURM_MEMORY}"
            "--time=${SLURM_TIME}"
          )
          if [[ -n "${SLURM_PARTITION:-}" ]]; then
            slurm_arguments+=("--partition=${SLURM_PARTITION}")
          fi
          if [[ -n "${SLURM_ACCOUNT:-}" ]]; then
            slurm_arguments+=("--account=${SLURM_ACCOUNT}")
          fi

          workspace_quoted="$(printf "%q" "${GITHUB_WORKSPACE}")"
          srun "${slurm_arguments[@]}" bash -lc "cd ${workspace_quoted} && bash scripts/ci_gpu_smoke.sh" \
            2>&1 | tee artifacts/gpu-smoke/slurm/srun.log

      - name: Upload GPU smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-smoke
          path: artifacts/gpu-smoke/**
          if-no-files-found: ignore
          retention-days: 14
