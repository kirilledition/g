name: README Code Size

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - src/**
      - README.md
      - scripts/update_readme_code_summary.py
      - .github/workflows/readme-code-size.yml
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - src/**
      - README.md
      - scripts/update_readme_code_summary.py
      - .github/workflows/readme-code-size.yml
  workflow_dispatch:

concurrency:
  group: readme-code-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOC_COMMIT: eb5cef64db2b2d4380f501568cc584b7cab4ba50
  CLOC_SHA256: bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83
  CLOC_VERSION: "2.10"
  PYTHON_VERSION: "3.14"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download cloc
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/AlDanial/cloc/${CLOC_COMMIT}/cloc" -o "${RUNNER_TEMP}/cloc"
          printf '%s  %s\n' "${CLOC_SHA256}" "${RUNNER_TEMP}/cloc" | sha256sum --check --strict
          reported_cloc_version="$(perl "${RUNNER_TEMP}/cloc" --version)"
          printf 'cloc version: %s\n' "${reported_cloc_version}"
          test "${reported_cloc_version}" = "${CLOC_VERSION}"

      - name: Check README code-size summary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_readme_code_summary.py --cloc-command "perl ${RUNNER_TEMP}/cloc" --check
