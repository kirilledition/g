name: README Code Size

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - src/**
      - README.md
      - scripts/update_readme_code_summary.py
      - .github/workflows/readme-code-size.yml
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - src/**
      - README.md
      - scripts/update_readme_code_summary.py
      - .github/workflows/readme-code-size.yml
  workflow_dispatch:

concurrency:
  group: readme-code-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download cloc
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/AlDanial/cloc/master/cloc -o "${RUNNER_TEMP}/cloc"
          perl "${RUNNER_TEMP}/cloc" --version

      - name: Check README code-size summary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_readme_code_summary.py --cloc-command "perl ${RUNNER_TEMP}/cloc" --check
