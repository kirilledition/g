name: README Code Size

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - src/**
      - README.md
      - scripts/update_readme_code_summary.py
      - .github/workflows/readme-code-size.yml
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - src/**
      - README.md
      - scripts/update_readme_code_summary.py
      - .github/workflows/readme-code-size.yml
  workflow_dispatch:

concurrency:
  group: readme-code-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  check:
    name: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download cloc
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/AlDanial/cloc/master/cloc -o "${RUNNER_TEMP}/cloc"
          perl "${RUNNER_TEMP}/cloc" --version

      - name: Check README code-size summary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_readme_code_summary.py --cloc-command "perl ${RUNNER_TEMP}/cloc" --check

  refresh:
    name: refresh
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download cloc
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/AlDanial/cloc/master/cloc -o "${RUNNER_TEMP}/cloc"
          perl "${RUNNER_TEMP}/cloc" --version

      - name: Refresh README code-size summary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_readme_code_summary.py --cloc-command "perl ${RUNNER_TEMP}/cloc"

      - name: Commit README code-size summary
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README code-size summary is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README code size summary"
          git push
