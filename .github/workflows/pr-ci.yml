name: PR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  RUST_MSRV: "1.85.0"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install format dependencies without the project package
        env:
          RUSTFLAGS: "--allow=non-local-definitions"
        run: uv sync --group dev --frozen --no-install-project

      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .

      - name: Check Rust formatting
        run: cargo fmt --check

  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain for source-built Python dependencies
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install lint dependencies without the project package
        env:
          RUSTFLAGS: "--allow=non-local-definitions"
        run: uv sync --group dev --frozen --no-install-project

      - name: Run Ruff lint
        run: uv run --no-sync ruff check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain for source-built Python dependencies
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install typecheck dependencies without the project package
        env:
          RUSTFLAGS: "--allow=non-local-definitions"
        run: uv sync --group dev --frozen --no-install-project

      - name: Run Python type checks
        run: uv run --no-sync ty check src tests scripts

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain for mixed-package test installs
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install project and test dependencies
        env:
          RUSTFLAGS: "--allow=non-local-definitions"
        run: uv sync --group dev --frozen

      - name: Run fast test suite
        run: >
          uv run --no-sync pytest tests/
          -m "not phase0_data and not phase1_parity"
          -v

  rust-clippy:
    name: rust-clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: >
          cargo clippy --workspace --all-targets --locked --
          -D warnings
          -W clippy::pedantic

  rust-clippy-beta:
    name: rust-clippy-beta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust beta toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: beta
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run beta Clippy as an advisory check
        continue-on-error: true
        run: >
          cargo clippy --workspace --all-targets --locked --
          -D warnings
          -W clippy::pedantic

  rust-docs:
    name: rust-docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

  rust-features:
    name: rust-features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Check additive feature combinations
        run: >
          cargo hack check --workspace --feature-powerset
          --exclude-features extension-module
          --all-targets
          --locked

      - name: Check Python extension feature
        run: cargo check --workspace --features extension-module --lib --locked

  rust-tests:
    name: rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export Python shared library path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_ENV}"
          import os
          import sysconfig

          library_dir = sysconfig.get_config_var("LIBDIR")
          previous_path = os.environ.get("LD_LIBRARY_PATH", "")
          print(f"LD_LIBRARY_PATH={library_dir}:{previous_path}")
          PY

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install Python dependencies for Rust integration tests
        env:
          RUSTFLAGS: "--allow=non-local-definitions"
        run: uv sync --group dev --frozen

      - name: Run locked Rust test suite
        run: cargo test --workspace --locked

  rust-msrv:
    name: rust-msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up minimum Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - uses: Swatinem/rust-cache@v2

      - name: Check minimum supported Rust version
        continue-on-error: true
        run: cargo check --workspace --all-targets --locked

  rust-minimal-versions:
    name: rust-minimal-versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2

      - name: Resolve direct minimal dependency versions
        continue-on-error: true
        run: cargo update -Zdirect-minimal-versions

      - name: Check direct minimal dependency versions
        continue-on-error: true
        run: cargo check --workspace --all-targets

  coverage:
    name: coverage
    needs:
      - python-tests
      - rust-tests
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export Python shared library path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_ENV}"
          import os
          import sysconfig

          library_dir = sysconfig.get_config_var("LIBDIR")
          previous_path = os.environ.get("LD_LIBRARY_PATH", "")
          print(f"LD_LIBRARY_PATH={library_dir}:{previous_path}")
          PY

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install project and coverage dependencies
        env:
          RUSTFLAGS: "--allow=non-local-definitions"
        run: uv sync --group dev --frozen

      - name: Generate Python coverage
        continue-on-error: true
        run: >
          uv run --no-sync pytest tests/
          -m "not phase0_data and not phase1_parity"
          --cov=src/g
          --cov-report=xml:coverage-python.xml
          --cov-report=term-missing
          --cov-fail-under=0

      - name: Generate Rust coverage
        continue-on-error: true
        run: >
          cargo llvm-cov --workspace --lcov
          --output-path coverage-rust.lcov
          --locked

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage-python.xml,coverage-rust.lcov
          flags: python,rust
          use_oidc: true
          fail_ci_if_error: false

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - format
      - python-lint
      - typecheck
      - python-tests
      - rust-clippy
      - rust-docs
      - rust-features
      - rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all PR jobs to pass
        shell: bash
        run: |
          set -euo pipefail
          echo "format: ${{ needs.format.result }}"
          echo "python-lint: ${{ needs['python-lint'].result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "python-tests: ${{ needs['python-tests'].result }}"
          echo "rust-clippy: ${{ needs['rust-clippy'].result }}"
          echo "rust-docs: ${{ needs['rust-docs'].result }}"
          echo "rust-features: ${{ needs['rust-features'].result }}"
          echo "rust-tests: ${{ needs['rust-tests'].result }}"
          test "${{ needs.format.result }}" = "success"
          test "${{ needs['python-lint'].result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs['python-tests'].result }}" = "success"
          test "${{ needs['rust-clippy'].result }}" = "success"
          test "${{ needs['rust-docs'].result }}" = "success"
          test "${{ needs['rust-features'].result }}" = "success"
          test "${{ needs['rust-tests'].result }}" = "success"
