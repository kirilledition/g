name: PR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "4"
  PYTHON_VERSION: "3.14"
  RUST_VERSION: "1.97.1"
  RUST_MSRV: "1.97.1"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check immutable GitHub Action references
        run: python -m tooling.debug.check_github_action_pins

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install format dependencies without the project package
        run: uv sync --group dev --group cuda-format --frozen --no-install-project

      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check CUDA and native C++ formatting
        run: just cuda-format-check

  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain for source-built Python dependencies
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install lint dependencies without the project package
        run: uv sync --group dev --frozen --no-install-project

      - name: Run Ruff lint
        run: uv run --no-sync ruff check .

  cuda-lint:
    name: cuda-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain for source-built Python dependencies
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install CUDA lint dependencies without the project package
        run: uv sync --group dev --group cuda-lint --frozen --no-install-project

      - name: Run CUDA and native C++ lint
        run: PYTHONPATH=src:. uv run --no-sync python -m tooling.cli.debug --config-name debug_check_cuda_native

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain for source-built Python dependencies
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install typecheck dependencies without the project package
        run: uv sync --group dev --frozen --no-install-project

      - name: Run Python type checks
        run: uv run --no-sync ty check src tests scripts

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain for mixed-package test installs
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install project and test dependencies
        run: uv sync --group dev --frozen

      - name: Run fast test suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/python-tests
          uv run --no-sync pytest tests/ \
            -m "not phase0_data and not phase1_parity" \
            -v \
            --junitxml=artifacts/python-tests/junit.xml

      - name: Upload Python test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-tests
          path: artifacts/python-tests/**
          if-no-files-found: ignore
          retention-days: 14

  package-install:
    name: package-install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain for source-built wheel
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build wheel and source distribution
        run: uv build --sdist --wheel --out-dir dist --clear

      - name: Install built wheel into a clean environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv "${RUNNER_TEMP}/g-package-install" --python "${{ env.PYTHON_VERSION }}"
          uv pip install --python "${RUNNER_TEMP}/g-package-install/bin/python" dist/*.whl

      - name: Run installed console script help
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-install-artifacts
          "${RUNNER_TEMP}/g-package-install/bin/g" --help | tee package-install-artifacts/g-help.txt
          "${RUNNER_TEMP}/g-package-install/bin/g" regenie --help | tee package-install-artifacts/g-regenie-help.txt

      - name: Upload package-install artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-install
          path: |
            dist/**
            package-install-artifacts/**
          if-no-files-found: ignore
          retention-days: 14

  rust-clippy:
    name: rust-clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Run Clippy
        run: >
          cargo clippy --workspace --all-targets --locked --
          -W clippy::pedantic

  rust-clippy-beta:
    name: rust-clippy-beta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust beta toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: beta
          components: clippy

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Run beta Clippy as an advisory check
        continue-on-error: true
        run: >
          cargo clippy --workspace --all-targets --locked --
          -W clippy::pedantic

  rust-docs:
    name: rust-docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

  rust-features:
    name: rust-features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-hack@0.6.45

      - name: Check additive feature combinations
        run: >
          cargo hack check --workspace --feature-powerset
          --exclude-features extension-module
          --all-targets
          --locked

      - name: Check Python extension feature
        run: cargo check --workspace --features extension-module --lib --locked

  rust-tests:
    name: rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export Python shared library path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_ENV}"
          import os
          import sys
          import sysconfig

          library_dir = sysconfig.get_config_var("LIBDIR")
          previous_path = os.environ.get("LD_LIBRARY_PATH", "")
          print(f"PYO3_PYTHON={sys.executable}")
          print(f"PYTHON_SYS_EXECUTABLE={sys.executable}")
          print(f"PYTHON_LIBDIR={library_dir}")
          print(f"LD_LIBRARY_PATH={library_dir}:{previous_path}")
          PY

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST PYO3 PYTHON Python python LD_LIBRARY_PATH"

      - name: Install Python dependencies for Rust integration tests
        run: uv sync --group dev --frozen

      - name: Run locked Rust test suite
        run: cargo test --workspace --locked

  rust-msrv:
    name: rust-msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up minimum Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Check minimum supported Rust version
        continue-on-error: true
        run: cargo check --workspace --all-targets --locked

  rust-minimal-versions:
    name: rust-minimal-versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Resolve direct minimal dependency versions
        continue-on-error: true
        run: cargo update -Zdirect-minimal-versions

      - name: Check direct minimal dependency versions
        continue-on-error: true
        run: cargo check --workspace --all-targets

  coverage:
    name: coverage
    needs:
      - python-tests
      - rust-tests
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export Python shared library path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_ENV}"
          import os
          import sys
          import sysconfig

          library_dir = sysconfig.get_config_var("LIBDIR")
          previous_path = os.environ.get("LD_LIBRARY_PATH", "")
          print(f"PYO3_PYTHON={sys.executable}")
          print(f"PYTHON_SYS_EXECUTABLE={sys.executable}")
          print(f"PYTHON_LIBDIR={library_dir}")
          print(f"LD_LIBRARY_PATH={library_dir}:{previous_path}")
          PY

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST PYO3 PYTHON Python python LD_LIBRARY_PATH"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Install project and coverage dependencies
        run: uv sync --group dev --frozen

      - name: Generate Python coverage
        continue-on-error: true
        run: >
          uv run --no-sync pytest tests/
          -m "not phase0_data and not phase1_parity"
          --cov=src/g
          --cov-report=xml:coverage-python.xml
          --cov-report=term-missing
          --cov-fail-under=0

      - name: Generate Rust coverage
        continue-on-error: true
        run: >
          cargo llvm-cov --workspace --lcov
          --output-path coverage-rust.lcov
          --locked

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage-python.xml,coverage-rust.lcov
          flags: python,rust
          use_oidc: true
          fail_ci_if_error: false

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - format
      - package-install
      - cuda-lint
      - python-lint
      - typecheck
      - python-tests
      - rust-clippy
      - rust-docs
      - rust-features
      - rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all PR jobs to pass
        shell: bash
        run: |
          set -euo pipefail
          echo "format: ${{ needs.format.result }}"
          echo "package-install: ${{ needs['package-install'].result }}"
          echo "cuda-lint: ${{ needs['cuda-lint'].result }}"
          echo "python-lint: ${{ needs['python-lint'].result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "python-tests: ${{ needs['python-tests'].result }}"
          echo "rust-clippy: ${{ needs['rust-clippy'].result }}"
          echo "rust-docs: ${{ needs['rust-docs'].result }}"
          echo "rust-features: ${{ needs['rust-features'].result }}"
          echo "rust-tests: ${{ needs['rust-tests'].result }}"
          test "${{ needs.format.result }}" = "success"
          test "${{ needs['package-install'].result }}" = "success"
          test "${{ needs['cuda-lint'].result }}" = "success"
          test "${{ needs['python-lint'].result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs['python-tests'].result }}" = "success"
          test "${{ needs['rust-clippy'].result }}" = "success"
          test "${{ needs['rust-docs'].result }}" = "success"
