name: Monthly Rot Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "4"
  PYTHON_VERSION: "3.14"
  RUST_VERSION: "1.97.1"

jobs:
  monthly-rot-check:
    name: monthly-rot-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export Python shared library path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_ENV}"
          import os
          import sysconfig

          library_dir = sysconfig.get_config_var("LIBDIR")
          previous_path = os.environ.get("LD_LIBRARY_PATH", "")
          print(f"LD_LIBRARY_PATH={library_dir}:{previous_path}")
          PY

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: "2.41.0"
          make-default: false

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install project and test dependencies
        run: uv sync --group dev --frozen

      - name: Run fast Python test suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/monthly-python-tests
          uv run --no-sync pytest tests/ \
            -m "not phase0_data and not phase1_parity" \
            -v \
            --junitxml=artifacts/monthly-python-tests/junit.xml

      - name: Run locked Rust test suite
        run: cargo test --workspace --locked

      - name: Upload monthly rot check artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monthly-rot-check
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
