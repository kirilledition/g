name: Monthly Rot Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  monthly-rot-check:
    name: monthly-rot-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export Python shared library path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_ENV}"
          import os
          import sysconfig

          library_dir = sysconfig.get_config_var("LIBDIR")
          previous_path = os.environ.get("LD_LIBRARY_PATH", "")
          print(f"LD_LIBRARY_PATH={library_dir}:{previous_path}")
          PY

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install project and test dependencies
        env:
          RUSTFLAGS: "--allow=non-local-definitions"
        run: uv sync --group dev --frozen

      - name: Run fast Python test suite
        run: >
          uv run --no-sync pytest tests/
          -m "not phase0_data and not phase1_parity and not cli_smoke"
          -v

      - name: Run locked Rust test suite
        run: cargo test --workspace --locked

      - name: Run installed CLI smoke test
        run: uv run --no-sync pytest tests/test_cli_smoke.py -m cli_smoke -v
