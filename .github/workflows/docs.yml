name: Documentation

on:
  push:
    branches: [main]
    paths:
      - documentation/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - Justfile
      - .github/workflows/docs.yml
      - "!documentation/scratchpad/**"
  pull_request:
    branches: [main]
    paths:
      - documentation/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - Justfile
      - .github/workflows/docs.yml
      - "!documentation/scratchpad/**"

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHON_VERSION: "3.14"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install documentation dependencies
        run: uv sync --group docs --frozen --no-install-project

      - name: Build documentation
        run: uv run --no-sync zensical build --clean

      - name: Check documentation rendering hooks
        run: uv run --no-sync python -m tooling.debug.check_docs_rendering

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload documentation artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: documentation_rendered_website

  deploy:
    name: deploy
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
