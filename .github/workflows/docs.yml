name: Documentation

on:
  push:
    branches: [main]
    paths:
      - documentation/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - Justfile
      - .github/workflows/docs.yml
      - "!documentation/scratchpad/**"
  pull_request:
    branches: [main]
    paths:
      - documentation/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - Justfile
      - .github/workflows/docs.yml
      - "!documentation/scratchpad/**"

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install documentation dependencies
        run: uv sync --group docs --frozen --no-install-project

      - name: Build documentation
        run: uv run --no-sync zensical build --clean

      - name: Check documentation rendering hooks
        run: uv run --no-sync python -m tooling.debug.check_docs_rendering

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload documentation artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: documentation_rendered_website

  deploy:
    name: deploy
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
