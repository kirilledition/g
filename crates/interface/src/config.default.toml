[trait]
step = 2
trait_type = "quantitative"
bsize = 16384

[binary]
firth = false
approx = false
p_threshold = 0.05
firth_se = false

[compute]
device = "cpu"
staging_depth = 1
native_callback_batch_size = 1
trusted_no_missing_diploid = false
trusted_bgen_validation_mode = "cache_on_miss"
sample_key_mode = "iid"
multi_phenotype_sample_mode = "per-phenotype"
firth_batch_size = 2048
firth_candidate_capacity = 16384
binary_null_maximum_iterations = 50
binary_null_coefficient_tolerance = 1.0e-6
null_logistic_nonconvergence_policy = "fail"
binary_minimum_probability = 1.0e-6
binary_minimum_variance = 1.0e-8
binary_relative_variance_tolerance = 1.0e-6
linear_minimum_variance = 1.0e-8
linear_relative_variance_tolerance = 1.0e-6
firth_maximum_iterations = 250
firth_gradient_tolerance = 2.5e-4
firth_coefficient_tolerance = 2.5e-4
firth_likelihood_tolerance = 2.5e-4
firth_maximum_step_size = 5.0
firth_pseudo_maximum_iterations = 50
firth_pseudo_inner_maximum_iterations = 25
firth_newton_raphson_zero_start_iterations = 100
firth_line_search_maximum_attempts = 25
firth_step_halving_maximum_attempts = 12
firth_initial_response_scale = 4.863891244002886
firth_sparse_carrier_dosage_threshold = 1.0e-4
firth_step_halving_scale = 0.5
null_firth_maximum_iterations = 1000
null_firth_gradient_tolerance = 50.0e-6
null_firth_maximum_step_size = 25.0
null_firth_fallback_iteration_multiplier = 5
null_firth_fallback_step_divisor = 5.0
null_firth_line_search_maximum_attempts = 25
null_firth_step_halving_scale = 0.5
use_block_firth_math = false
bgen_decode_tile_variant_count = 64
gpu_genotype_format = "auto"
# Score-test kernels default to the float32 fast path. This is an internal
# JAX compute dtype; public result statistics are still written as float32.
# Use float64 only when parity or numerical debugging needs outweigh throughput.
score_dtype = "float32"
# Firth internals are parity-sensitive and currently require float64. Public
# result statistics are still written as float32.
firth_dtype = "float64"
jax_persistent_cache = true
jax_persistent_cache_min_entry_size_bytes = -1
jax_persistent_cache_min_compile_time_seconds = 0
jax_xla_autotune_cache = false
jax_transfer_guard = false

[output]
format = "parquet"
writer_threads = 4
writer_queue_depth = 16
chunks_per_arrow_file = 16
arrow_compression = "zstd"
parquet_compression = "none"
# Public BETA/SE/CHISQ/LOG10P output columns default to float32 for compact
# REGENIE-style output. Use float64 for parity/debugging runs that need to
# preserve high-precision compute results in Arrow/Parquet outputs.
output_statistic_dtype = "float32"
resume = false
resume_mode = "fast"
finalize_parquet = false

[diagnostics]
telemetry = "progress"
log_filter = "info"
log_stderr = true
progress_interval_seconds = 5
progress_interval_chunks = 10
trace_filter = "g.native.bgen=trace,g.output=debug"
trace_event_cap = 1000000
log_queue_size = 65536
log_lossy = true
include_source_location = false
include_span_events = false
